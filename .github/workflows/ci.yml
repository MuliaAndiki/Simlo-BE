name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  express_code_quality:
    name: Express Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: express
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: express/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Format check
        run: npm run format

      - name: Lint & typecheck
        run: npm run lint

      - name: Build
        run: npm run build

  fast_checks:
    name: FastAPI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fast/requirements.txt

      - name: Run FastAPI checks
        working-directory: fast
        env:
          BACKEND_URL: http://localhost:5000
        run: |
          chmod +x check.sh
          ./check.sh

  express_tests:
    name: Express Tests
    runs-on: ubuntu-latest
    needs: [express_code_quality, fast_checks]
    defaults:
      run:
        working-directory: express
    env:
      CI: true
      GITHUB_ACTIONS: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/simlo_test
      JWT_SECRET: ci-test-secret
      INTERNAL_API_SECRET: ci-test-internal-api-secret
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      ML_SERVICE_URL: http://localhost:8000
      ML_SERVICE_TIMEOUT_MS: 30000
      CLOUDINARY_CLOUD_NAME: ci-test-cloud
      CLOUDINARY_API_KEY: ci-test-key
      CLOUDINARY_API_SECRET: ci-test-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simlo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: express/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run database migrations
        run: npm run prisma:migrate:deploy

      - name: Run Express tests
        run: npm test
